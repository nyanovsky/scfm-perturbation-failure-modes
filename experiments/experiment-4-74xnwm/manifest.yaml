results:
  answer: 'Fine-tuning scGPT on the screen with its own published perturbation recipe leaves the queried response
    features inside run 3''s shuffled-label band in all 10 fine-tuned models (5 gene-table arms x 2 cell lines)
    and 5 to 43 times below the model''s own gene table. The prediction it installs is nearly the same profile for
    every knockdown, so a read-out asking which gene was perturbed has little to recover. Reading the same checkpoints
    through the model''s own perturbation-flag query instead is noisier and not a clean null: 2 of those 10 readings,
    both in Jurkat, sit above the band and above that query''s own shuffled draws. This is a bound at the achieved
    resolution, not a demonstration that fine-tuning cannot install the signal.'
  verdict_cell: residual target, reliability-weighted, ceiling-corrected, MLP translator, grouped folds 0 and 1
  checkpoint_selection: the tutorial's own rule, validation Pearson over held-out perturbations. The masked-MSE
    rule is tracked in parallel inside every run with its own patience counter; the two keep the same epoch in 6
    of the 16 runs
  models_in_band: 10 of 10
  best_response_feature_score: 0.045629
  response_features_restricted:
    hepg2:
      before: 0.026516
      after: 0.012132
      own_query: 0.049769
      band:
