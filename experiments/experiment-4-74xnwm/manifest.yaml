      p_two_sided: 0.036
    n_paired_all_references: 32
  reproduces_run3: 6 of the 7 comparable whole-screen arms agree by mutual interval containment, largest gap 0.008241;
    HepG2's node arm does not (run 3 0.031725, run 4 -0.003095) and carries no claim
  recipe_provenance: all 14 settings scGPT's Tutorial_Perturbation.ipynb names match this run; the one difference
