outputs:
  checkpoints:
    artifact: "artifact://fundacion-instituto-leloir-553557/experiments/exp_01m0trpxqyf0g8pq29k774xnwm/checkpoints/"
    what: "16 fine-tuned models, one directory per (cell line, run): model_best.pt, model_final.pt, gene_table_{init,final}.npz, train_config.json, loss_history.json, direct_prediction.npz"
    registered_as: "scfm-run4-ft-<line>-<arm>"
