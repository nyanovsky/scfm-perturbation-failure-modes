results:
  verdict_metric: "fold-centred, reliability-weighted, ceiling-corrected per-perturbation Pearson correlation, median over held-out perturbations of a grouped split; chosen post hoc because the pre-registered cell fails its own shuffled-label control"
  hepg2:
    best_model_arm: "scgpt_emb"
    best_model_score: 0.1089
    best_model_ci: [0.07909, 0.1417]
    coexpression: 0.005176
    coexpression_ci: [-0.006355, 0.01692]
    shuffled_label_ceiling: 0.02860
    paired_difference_vs_coexpression: 0.03862
    node_free: 0.03656
  jurkat:
    best_model_arm: "transcriptformer_emb"
    best_model_score: 0.1726
    best_model_ci: [0.1393, 0.2054]
    coexpression: 0.03364
    coexpression_ci: [0.01679, 0.04929]
    shuffled_label_ceiling: 0.02040
    paired_difference_vs_coexpression: 0.07466
    node_free: 0.01893
  response_features: "largest response-only score anywhere 0.03438; adding them to the embedding moves the score by at most 0.02010 with no consistent sign. Score-dependent on their own: none clears the HepG2 null (ceiling 0.02860), scPRINT and TranscriptFormer clear the Jurkat null (0.02040), and on the pre-registered score TranscriptFormer beats co-expression in HepG2 by 0.02094 [0.01125, 0.03279]"
  discrimination: "cell-eval 0.8.2 on effect profiles, chance 0.5: embedding arms 0.5211-0.5793, co-expression 0.4647 (HepG2) and 0.4845 (Jurkat), response-only arms 0.4665-0.4965. The pre-registered pin 0.5.19 was never released; 0.5.18 and 0.5.21 differ from 0.8.2 by up to 0.1141 on the same predictions and reverse the ranking"
  anchor_sensitivity: "HepG2, three models: no anchor lifts a response-only arm above the 0.02860 null (best 0.02076, scPRINT at individual cells). Uniform virtual beats mean control for scGPT (+0.00707 [0.00091, 0.01338]) and scPRINT (+0.00936 [0.00267, 0.01762]) and loses for TranscriptFormer (-0.01195 [-0.01736, -0.00661]). Re-run mean-control arms reproduce the main sweep exactly"
  no_op_query_correction: "individual-cells no-op queries are dropped per (perturbed gene, value), not by deleting the whole dose: 584 no-op queries touch 431 of 7860 query rows, the correction is a per-row positive scale factor the z-score removes (max change 2.68e-06 against the shipped arrays), 15 of 15 checks pass"
  beeline_reproduction: "source paper's scGPT embedding baseline, trained on STRING/hESC and scored on three hHEP cells: mean AUPRC 0.6724 against 0.6247 reported. A permuted-embedding control keeping gene identity reaches 0.6271; restricted to unseen-gene pairs the real embedding gets 0.5798 against per-cell chance 0.3987-0.5962 and the identity control 0.5119"
  transfer_shared_genes: "best arm 0.2896 against a gene-identity null of 0.2517"
  transfer_unseen_genes: "best arm 0.09392 against a gene-identity null of 0.003236 or below; 89 and 78 held-out perturbations"
  common_scope_250: "scGPT, scPRINT and TranscriptFormer clear the null in both lines; AIDO.Cell does not (-0.00055 HepG2, 0.01810 Jurkat against 0.02399 / 0.02646)"
  gene_table_provenance: "read from the four released checkpoints. TranscriptFormer: 23,830 x 2,560 table whose 23,823 gene rows are bitwise the ESM2 file shipped beside the weights (max abs diff 0.0; the 7 special-token rows differ by 2.98e-08 because they are regenerated from RandomState(42)), loader hard-codes freeze=True. scPRINT: 44,756 x 256, freeze_embeddings false and two Adam moment tensors of exactly that shape in the optimizer state, so it was trained. scGPT: 60,697 x 512 plain nn.Embedding, learned from scratch. AIDO.Cell: 19,266 x 640 position embedding over the fixed gene order, learned from scratch"
  protein_arm: "gene tables built from UniProt sequence (release 2026_02, 20,431 reviewed human entries; 3,740 of 3,755 genes by Ensembl xref, 15 by symbol, 0 unmapped; 437 proteins chunked past the 1,022-residue context) and embedded with facebook/esm2_t33_650M_UR50D and facebook/esm2_t36_3B_UR50D. Through the identical translator, folds and scoring: esm2_3b_emb 0.1074 [0.07756, 0.1467] in HepG2 and 0.1784 [0.1509, 0.2130] in Jurkat, against a width-matched random-vector null of 0.006805 / 0.008337 and shuffled-label draws reaching at most 0.009831 / 0.01047. Paired, it beats TranscriptFormer in both lines (+0.03656 [0.01053, 0.06718]; +0.02907 [0.00673, 0.05310]), ties scPRINT in both, ties scGPT in HepG2 (+0.02805 [-0.00251, 0.06256]) and beats it in Jurkat (+0.04740 [0.02034, 0.07837]). All 8 within-line and 36 cross-line arms the protein jobs re-ran reproduce the main sweep to 0.0"
  protein_unseen_gene_transfer: "over the two directions and three destination-reference choices, the four protein-derived tables clear zero in 22 of 24 cells; scGPT in 0 of 6, co-expression and the two random-vector nulls in 0 of 18"
  gene_table_similarity: "Spearman correlation of gene-gene cosine-similarity orderings over 1,500 genes (random-table floor |r| <= 0.002116, HepG2): ESM2-3B vs ESM2-650M 0.8506, TranscriptFormer vs ESM2-3B 0.3960, scGPT vs scPRINT 0.3037, scPRINT vs ESM2-650M 0.2727, scGPT vs ESM2-3B -0.01579, AIDO.Cell vs ESM2-3B -0.00052"
  control_cell_overlap: "plain co-expression arms move by at most 0.02397 between shared and disjoint control halves; embedding arms move by up to 0.01915"
