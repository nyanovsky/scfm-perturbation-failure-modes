results:
  verdict_metric: "the pre-registered rule, unchanged: residual target (against the TRAINING folds' mean), reliability-weighted, ceiling-corrected per-perturbation Pearson correlation, median over held-out perturbations of a grouped split. A fold-centred version of the same correlation, which removes the held-out fold's own per-gene mean, is reported beside it everywhere as a post-hoc diagnostic and never substituted for it"
  uncertainty: "every interval is a 2,000-resample cluster bootstrap over response groups, not over perturbations: HepG2's 524 in-scope perturbations are 226 groups with one of 149, Jurkat's 705 are 452. Groups are recomputed from the bundle effect matrix by src/scfm_pfm/groups.py and reproduce the group counts all 256 grouped runs of the sweep recorded"
  hepg2:
    best_model_arm: "scgpt_emb"
    best_model_score_preregistered: 0.2719
    best_model_ci_preregistered: [0.2394, 0.3814]
    best_model_score_fold_centred: 0.1089
    coexpression_preregistered: 0.04879
    coexpression_ci_preregistered: [0.02346, 0.09292]
    shuffled_label_ceiling_preregistered: 0.02764
    paired_difference_vs_coexpression: "+0.1846 [0.1501, 0.2408] for scgpt_emb; every embedding arm clears zero"
    node_free: 0.03656
  jurkat:
    best_model_arm: "transcriptformer_full"
    best_model_score_preregistered: 0.2371
    best_model_ci_preregistered: [0.1831, 0.2938]
    best_model_score_fold_centred: 0.1659
    coexpression_preregistered: 0.04462
    coexpression_ci_preregistered: [0.0302, 0.0617]
    shuffled_label_ceiling_preregistered: 0.02351
    paired_difference_vs_coexpression: "+0.1371 [0.09442, 0.1819] for transcriptformer_full; every embedding arm clears zero"
    node_free: 0.01893
  response_features: "largest response-only score anywhere 0.03438 on the fold-centred diagnostic; adding them to the embedding moves the score by at most 0.02010 with no consistent sign. On their own: on the pre-registered rule 3 of 6 model-and-line combinations are numerically above co-expression, none by more than the paired comparison resolves (TranscriptFormer in HepG2 0.06533 against 0.04879, paired +0.01369 [-0.01946, 0.03119]); on the fold-centred score none clears the HepG2 null (0.02860) and scPRINT and TranscriptFormer clear the Jurkat one (0.02040)"
  discrimination: "cell-eval 0.8.2 on effect profiles, chance 0.5: embedding arms 0.5211-0.5793, co-expression 0.4647 (HepG2) and 0.4845 (Jurkat), response-only arms 0.4665-0.4965. The pre-registered pin 0.5.19 was never released; 0.5.18 and 0.5.21 differ from 0.8.2 by up to 0.1141 on the same predictions and reverse the ranking"
  anchor_sensitivity: "HepG2, three models: no anchor lifts a response-only arm above the 0.02860 null (best 0.02076, scPRINT at individual cells). Uniform virtual beats mean control for scGPT (+0.00707 [0.00091, 0.01338]) and scPRINT (+0.00936 [0.00267, 0.01762]) and loses for TranscriptFormer (-0.01195 [-0.01736, -0.00661]). Re-run mean-control arms reproduce the main sweep exactly"
  no_op_query_correction: "individual-cells no-op queries are dropped per (perturbed gene, value), not by deleting the whole dose: 584 no-op queries touch 431 of 7860 query rows, the correction is a per-row positive scale factor the z-score removes (max change 2.68e-06 against the shipped arrays), 15 of 15 checks pass"
  beeline_reproduction: "source paper's scGPT embedding baseline re-implemented, not reproduced: trained on STRING/hESC and scored on three hHEP cells, mean AUPRC 0.6724 against 0.6247 reported, up to 0.09176 apart on one cell, with no pre-registered tolerance and no seed-noise estimate, so the gap is unexplained. A permuted-embedding control keeping gene identity reaches 0.6271; restricted to unseen-gene pairs the real embedding gets 0.5798 against per-cell chance 0.3987-0.5962 and the identity control 0.5119"
  transfer_shared_genes: "on the pre-registered rule, best arm 0.2770 against a gene-identity null of 0.2441"
  transfer_unseen_genes: "on the pre-registered rule, best arm 0.1262 against a gene-identity null of 0.02728 or below; 89 and 78 held-out perturbations"
  common_scope_250: "scGPT, scPRINT and TranscriptFormer clear the null in both lines on both scores. AIDO.Cell is the one case the two scores disagree about: on the pre-registered rule its best arm is 0.05032 in HepG2 against a 0.04870 ceiling and 0.06841 in Jurkat against 0.03978; on the fold-centred one -0.00055 and 0.01810 against 0.02399 / 0.02646. Not separated from the null either way at this sample size"
  gene_table_provenance: "read from the four released checkpoints. TranscriptFormer: 23,830 x 2,560 table whose 23,823 gene rows are bitwise the ESM2 file shipped beside the weights (max abs diff 0.0; the 7 special-token rows differ by 2.98e-08 because they are regenerated from RandomState(42)), loader hard-codes freeze=True. scPRINT: 44,756 x 256, freeze_embeddings false and two Adam moment tensors of exactly that shape in the optimizer state, so it was trained. scGPT: 60,697 x 512 plain nn.Embedding, learned from scratch. AIDO.Cell: 19,266 x 640 position embedding over the fixed gene order, learned from scratch"
  protein_arm: "gene tables built from UniProt sequence (release 2026_02, 20,431 reviewed human entries; 3,740 of 3,755 genes by Ensembl xref, 15 by symbol, 0 unmapped; 437 proteins chunked past the 1,022-residue context) and embedded with facebook/esm2_t33_650M_UR50D and facebook/esm2_t36_3B_UR50D. Through the identical translator, folds and scoring, on the pre-registered rule: esm2_3b_emb 0.2331 [0.1035, 0.4356] in HepG2 and 0.2642 [0.1959, 0.3269] in Jurkat, against a width-matched random-vector null of 0.03019 / 0.01731 and shuffled-label draws reaching at most 0.02764 / 0.01959. Paired against co-expression it is +0.1525 [0.06469, 0.2901] and +0.1564 [0.1048, 0.2026]. Against the single-cell tables it ties TranscriptFormer (+0.01793 [-0.01837, 0.06293] HepG2; +0.02338 [-0.001652, 0.04049] Jurkat), ties scPRINT (-0.005247 [-0.05539, 0.08199]; +0.0238 [-0.002735, 0.04427]), ties scGPT in HepG2 (-0.03207 [-0.1263, 0.08346]) and beats it in Jurkat (+0.06474 [0.03173, 0.08902]). All 8 within-line and 36 cross-line arms the protein jobs re-ran reproduce the main sweep to 0.0"
  protein_unseen_gene_transfer: "counted per destination-reference mode, because the non-transductive mode scores half the destination's perturbations (the other half builds its reference) while the other two score all of them. On the pre-registered rule, dest_reference (78-89 perturbations): protein-derived 8 of 8, scGPT 0 of 2, co-expression and nulls 0 of 6. dest_all (156-177): 7 of 8, 1 of 2, 0 of 6. source_only (156-177): 8 of 8, 2 of 2, 2 of 6"
  gene_table_similarity: "Spearman correlation of gene-gene cosine-similarity orderings over 1,500 genes (random-table floor |r| <= 0.002116, HepG2): ESM2-3B vs ESM2-650M 0.8506, TranscriptFormer vs ESM2-3B 0.3960, scGPT vs scPRINT 0.3037, scPRINT vs ESM2-650M 0.2727, scGPT vs ESM2-3B -0.01579, AIDO.Cell vs ESM2-3B -0.00052"
  control_cell_overlap: "plain co-expression arms move by at most 0.02397 between shared and disjoint control halves; embedding arms move by up to 0.01915"
